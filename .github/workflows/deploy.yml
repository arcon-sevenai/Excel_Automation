name: Deploy
on:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Fetch and decode OIDC token
        shell: "C:\\PROGRA~1\\Git\\bin\\bash.exe -e {0}"
        run: |
          export PATH="/d/Sumeet/tools:$PATH"
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=arcon-ci.siemens.com" | jq -r .value)
          echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq .
      - run: echo "deploying"
